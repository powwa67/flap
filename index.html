<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POWA-PROXY: SYSTEM BREACH</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --neon-green: #00ff41;
            --neon-cyan: #0ff;
            --neon-pink: #f0f;
            --dark-bg: #050505;
            --glass: rgba(0, 20, 0, 0.85);
        }

        body {
            margin: 0;
            background-color: var(--dark-bg);
            font-family: 'Share Tech Mono', monospace; /* HACKER FONT */
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            color: var(--neon-green);
        }

        #game-container-box {
            position: relative;
            background: #000;
            /* GREEN GLOW FOR HACKING */
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.2); 
            border: 2px solid #333;
            border-radius: 4px; /* Sharper corners */
            overflow: hidden;
        }

        #debug-log {
            display: none; position: absolute; bottom: 10px; left: 10px; right: 10px;
            color: red; font-family: monospace; font-size: 12px;
            pointer-events: none; z-index: 999;
        }

        /* DIGITAL GRID OVERLAY */
        .scanline-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            opacity: 0.6;
        }

        .bg-gif {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0; transition: opacity 0.5s;
            pointer-events: none; z-index: 5; display: none; 
            filter: grayscale(100%) contrast(1.2); /* Matrix vibe */
        }

        .shake-small { animation: shake-s 0.1s; }
        .glitch-anim { animation: float-title 3s ease-in-out infinite; }

        @keyframes shake-s { 0% { transform: translate(0,0); } 50% { transform: translate(2px, 2px); } 100% { transform: translate(0,0); } }
        @keyframes float-title {
            0% { transform: translateY(0px); text-shadow: 2px 2px var(--neon-pink); } 
            50% { transform: translateY(-5px); text-shadow: -2px 2px var(--neon-cyan); }
            100% { transform: translateY(0px); text-shadow: 2px 2px var(--neon-pink); }
        }
        
        /* Time stop now looks like a system crash */
        .time-frozen {
            filter: invert(100%) contrast(150%);
            transition: filter 0.2s steps(4);
        }

        canvas { display: block; width: 100%; height: 100%; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column;
            justify-content: space-between; z-index: 10;
        }

        #top-bar {
            display: flex; align-items: center; padding: 20px; width: 100%; box-sizing: border-box;
            justify-content: center;
        }

        #progress-container { flex-grow: 1; display: flex; flex-direction: column; }

        #progress-bar {
            height: 12px; background: #111; border: 1px solid var(--neon-green);
            position: relative; overflow: hidden;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); 
        }

        #progress-fill {
            width: 0%; height: 100%; 
            background: var(--neon-green);
            transition: width 0.1s linear; box-shadow: 0 0 10px var(--neon-green);
        }
        
        #score-counter {
            display: none; 
            font-size: 4rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            font-weight: bold; letter-spacing: 5px;
        }

        #main-menu {
            position: absolute; top: 53%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; width: 100%; pointer-events: auto; z-index: 20;
        }

        h1 {
            color: #fff; 
            font-size: 3.5rem; margin: 0; line-height: 0.95;
            font-family: 'Orbitron', sans-serif; 
            letter-spacing: -2px; text-transform: uppercase;
        }
        
        .high-score-label {
            color: var(--neon-cyan); font-size: 1.2rem; margin-top: 10px;
            letter-spacing: 2px; text-shadow: 0 0 5px var(--neon-cyan);
        }

        /* TERMINAL STYLE LEADERBOARD */
        #leaderboard {
            margin: 15px auto; width: 320px; height: 220px;
            background: rgba(0, 10, 0, 0.95); 
            border: 1px solid var(--neon-green); 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1), inset 0 0 20px rgba(0, 0, 0, 0.8);
            padding: 10px; overflow: hidden;
            display: flex; flex-direction: column; pointer-events: auto;            
            text-align: left; box-sizing: border-box; 
        }

        #tab-container {
            display: flex; justify-content: center; margin-bottom: 8px; gap: 0;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            background: #000; border: 1px solid #333; color: #555;
            padding: 5px 10px; font-family: 'Share Tech Mono'; font-size: 0.9rem;
            cursor: pointer; flex-grow: 1; text-transform: uppercase;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: var(--neon-green); color: #000; border: 1px solid var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green); font-weight: bold;
        }

        #leaderboard-list {
            overflow-y: auto; -webkit-overflow-scrolling: touch; flex-grow: 1; text-align: left;
            font-family: 'Share Tech Mono';
        }
        #leaderboard-list::-webkit-scrollbar { width: 4px; }
        #leaderboard-list::-webkit-scrollbar-track { background: #000; }
        #leaderboard-list::-webkit-scrollbar-thumb { background: var(--neon-green); }
        
        #cheat-btn {
            background: transparent;
            border: 1px solid #555; color: #555;
            font-family: 'Share Tech Mono', sans-serif; font-size: 0.7rem; padding: 5px 10px;
            margin-top: 15px; cursor: pointer; border-radius: 0;
            text-transform: uppercase; transition: all 0.2s; pointer-events: auto; 
            display: inline-block; letter-spacing: 2px;
        }
        #cheat-btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); }
        #cheat-btn.active-cheat {
            background: var(--neon-pink); color: #fff; border-color: var(--neon-pink);
            box-shadow: 0 0 15px var(--neon-pink); opacity: 1; cursor: default;
        }

        #perf-btn {
            background: #000; border: 1px solid var(--neon-cyan); color: var(--neon-cyan);
            font-family: 'Share Tech Mono', sans-serif; font-size: 0.8rem; padding: 8px 15px;
            margin-top: 15px; cursor: pointer; 
            text-transform: uppercase; transition: all 0.2s; pointer-events: auto; 
            box-shadow: 0 0 5px var(--neon-cyan); position: relative; z-index: 30; 
        }
        #perf-btn:hover { background: var(--neon-cyan); color: #000; }
        
        .modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px;
            box-sizing: border-box; text-align: center; animation: fadeIn 0.3s;
            pointer-events: auto; backdrop-filter: blur(2px);
        }

        /* TERMINAL MODAL */
        #death-modal, #win-modal {
            border: 2px solid var(--neon-pink);
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.95),
                rgba(0,0,0,0.95) 2px,
                rgba(20,0,0,0.95) 4px
            );
        }
        #win-modal { border-color: var(--neon-green); background: rgba(0,20,0,0.95); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(1.1); } to { opacity: 1; transform: scale(1); } }

        .btn {
            background: #000;
            border: 1px solid red; 
            color: red; font-family: 'Orbitron', sans-serif; font-size: 1.2rem;
            padding: 15px; margin: 10px 0; cursor: pointer; width: 100%; max-width: 300px;
            box-shadow: 0 0 10px red;
            text-transform: uppercase; letter-spacing: 2px;
            transition: 0.2s;
        }
        .btn:hover { background: red; color: #000; }
        .btn:active { transform: translateY(2px); }
        
        .btn-copy { border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .btn-copy:hover { background: var(--neon-cyan); color: #000; }

        .btn-continue { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px var(--neon-green); margin-top: 15px; }
        .btn-continue:hover { background: var(--neon-green); color: #000; }

        .key-container { margin: 20px 0; width: 100%; max-width: 350px; }

        .key-box {
            background: #001100; border: 1px dashed var(--neon-green); color: var(--neon-green);
            padding: 15px; font-family: 'Share Tech Mono'; font-size: 1.1rem;
            user-select: text; word-break: break-all;
        }

        .key-label { font-size: 0.8rem; color: #555; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }

        .win-input-field {
            background: #000; border: 1px solid var(--neon-green); color: var(--neon-green); 
            padding: 15px; font-family: 'Share Tech Mono', sans-serif; font-size: 1.2rem; 
            text-align: center; text-transform: uppercase; margin: 15px 0; 
            width: 80%; outline: none; box-shadow: 0 0 10px var(--neon-green);
        }
        
        /* Utility */
        .blink { animation: blink 1s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        #flash-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; opacity: 0; pointer-events: none;
            transition: opacity 0.1s; z-index: 50; mix-blend-mode: overlay;
        }
        
        #warp-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0) 0%, rgba(0,255,255,0.5) 100%);
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
            z-index: 40; mix-blend-mode: screen;
        }
    </style>
</head>
<body>

    <div id="game-container-box">

                   style="background: #000; border: 1px solid red; color: white; padding: 10px;

                <button class="btn" onclick="submitWinDetails()" style="border-color: var(--neon-green); color:var(--neon-green); box-shadow: 0 0 10px var(--neon-green);">

    <script>
        function logError(msg) {
            console.error(msg);
            const el = document.getElementById('debug-log');
            if(el) { el.style.display='block'; el.innerText = "ERR: " + msg; }
        }
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            logError(msg);
            return false;
        };

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const scoreCounter = document.getElementById('score-counter');
        const wrapper = document.getElementById('game-container-box');
        const flashOverlay = document.getElementById('flash-overlay');
        const warpOverlay = document.getElementById('warp-overlay');
        const perfBtn = document.getElementById('perf-btn');
        const cheatBtn = document.getElementById('cheat-btn');
        
        const deathModal = document.getElementById('death-modal');
        const winModal = document.getElementById('win-modal');
        const menuHighScore = document.getElementById('menu-high-score');
        const deathScoreDisplay = document.getElementById('death-score-display');
        const deathBestDisplay = document.getElementById('death-best-display');
        
        const bgFail = document.getElementById('bg-fail');
        const bgWin = document.getElementById('bg-win');

        const LOGICAL_WIDTH = 540;
        const LOGICAL_HEIGHT = 960;
        const width = LOGICAL_WIDTH;
        const height = LOGICAL_HEIGHT;

        function resize() {
            let winW = window.innerWidth;
            let winH = window.innerHeight;
            let scale = Math.min(winW / LOGICAL_WIDTH, winH / LOGICAL_HEIGHT);
            if (scale > 1.2 && winW > 800) scale = Math.min(scale, 1.0);

            let finalW = Math.floor(LOGICAL_WIDTH * scale);
            let finalH = Math.floor(LOGICAL_HEIGHT * scale);
            
            wrapper.style.width = finalW + "px";
            wrapper.style.height = finalH + "px";
            canvas.width = LOGICAL_WIDTH;
            canvas.height = LOGICAL_HEIGHT;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- GAME CONFIG ---
        const KEY_ID = "day_27_cyber"; // NEW KEY
        const KEY_WARNING_MODE = "OFF"; 
        const WORKER_URL = "https://powa-vault.powwa.workers.dev"; 

        let TARGET_SCORE = 40; 
        
        let BASE_SPEED = 7;
        let currentSpeed = 7;
        let BASE_GAP = 180; // Slightly easier gap for the visual noise
        let GRAVITY = 0.6;
        let JUMP = 8.5;
        let difficultyOffset = 0; 
        
        let isCheatActive = false;
        const savedCheatDate = localStorage.getItem('powa-cheat-date');
        const todayStr = new Date().toDateString();
        if(savedCheatDate === todayStr) {
            isCheatActive = true;
            cheatBtn.innerText = "ROOT ACCESS ACTIVE";
            cheatBtn.classList.add('active-cheat');
            cheatBtn.disabled = false;
        }
        
        let PERF_MODE = false;
        let gameStartTime = 0;

        let highScore = localStorage.getItem('powa-high-score') || 0;
        let storedKeyId = localStorage.getItem('powa-key-id');
        let storedUnlock = localStorage.getItem('powa-unlocked');
        
        let isUnlocked = false;

        if(storedKeyId === KEY_ID && storedUnlock === 'true') {
            isUnlocked = true;
        } else {
            if(storedKeyId !== KEY_ID) {
                localStorage.setItem('powa-key-id', KEY_ID);
                localStorage.removeItem('powa-unlocked');
            }
            isUnlocked = false;
        }
        
        menuHighScore.innerText = `MAX_UPLOAD: ${highScore}`;

        // --- CYBERPUNK BIOMES ---
        // Replacing nature colors with neon tech palettes
        const BIOMES = [
            // Level 0: The Grid (Green)
            { bgTop: '#001000', bgBot: '#002000', grid: '#00ff41', nebula: '#003300', border: '#00ff41', char: '0' }, 
            // Level 1: Firewall (Red/Orange)
            { bgTop: '#100000', bgBot: '#200500', grid: '#ff4500', nebula: '#330000', border: '#ff4500', char: '1' }, 
            // Level 2: Deep Net (Cyan/Blue)
            { bgTop: '#000010', bgBot: '#001020', grid: '#00ffff', nebula: '#001133', border: '#00ffff', char: 'X' }, 
            // Level 3: Admin Root (Purple/Pink)
            { bgTop: '#100010', bgBot: '#200020', grid: '#ff00ff', nebula: '#220022', border: '#ff00ff', char: '?' }, 
            // Level 4: Glitch Void
            { bgTop: '#000000', bgBot: '#050505', grid: 'rainbow', nebula: 'rainbow', border: '#fff', char: '$' }
        ];

        let currentBiome = 0;
        let infiniteMode = false;

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = new AudioContext();

        // --- HELPERS ---
        function getWeekId() {
            const d = new Date();
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay()||7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            const weekNo = Math.ceil(( ( (d - yearStart) / 86400000) + 1)/7);
            return `week_${d.getUTCFullYear()}_${weekNo}_cyber`;
        }

        async function checkGlobalCheatStatus() {
            if(isCheatActive) return; 
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "CHECK_CHEAT_STATUS" })
                });
                const data = await response.json();
                if (data.exhausted) {
                    cheatBtn.classList.add('exhausted');
                    cheatBtn.innerText = "BACKDOOR PATCHED";
                    cheatBtn.disabled = false;
                } else {
                    cheatBtn.innerText = "EXPLOIT";
                    cheatBtn.disabled = false;
                }
            } catch(e) {
                cheatBtn.innerText = "EXPLOIT"; cheatBtn.disabled = false;
            }
        }

        async function claimCheat(e) {
            e.stopPropagation();
            if(cheatBtn.classList.contains('exhausted')) { alert("EXPLOIT PATCHED BY ADMIN."); return; }
            if(isCheatActive) return; 

            const code = prompt("Enter Root Password:");
            if(!code) return;

            cheatBtn.innerText = "DECRYPTING...";
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "CLAIM_CHEAT", cheatCode: code })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    isCheatActive = true;
                    localStorage.setItem('powa-cheat-date', new Date().toDateString());
                    cheatBtn.innerText = "ROOT ACCESS GRANTED";
                    cheatBtn.classList.add('active-cheat');
                    resetLevel();
                    alert("ROOT PRIVILEGES: START +10 UPLOAD");
                } else if (data.error === "FULL") {
                    cheatBtn.classList.add('exhausted');
                    cheatBtn.innerText = "PATCHED";
                    alert("TOO SLOW. PROXY CLOSED.");
                } else {
                    cheatBtn.innerText = "EXPLOIT";
                    alert("ACCESS DENIED");
                }
            } catch (error) { cheatBtn.innerText = "ERR_CONNECTION"; }
        }

        async function fetchServerKey() {
            const keyTextBox = document.getElementById('key-text');
            if (gameStartTime === 0 || score === 0) {
                 keyTextBox.innerText = "NO DATA FOUND"; keyTextBox.style.color = "red"; return;
            }
            keyTextBox.innerText = "DECRYPTING...";
            keyTextBox.style.color = "#ffff00";
            keyTextBox.style.animation = "blink 0.5s infinite";

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: "GET_KEY",  
                        score: score,

        function playTone(freq, type, duration, vol=0.1, delay=0) {
            try {
                if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime + delay);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + delay);
                osc.stop(audioCtx.currentTime + delay + duration);
            } catch(e) {}
        }

        // --- CYBERPUNK SOUND FX ---

            score: () => {

            explode: () => {
                // White noise burst
                try {
                    const bufferSize = audioCtx.sampleRate * 0.5;
                    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = audioCtx.createBufferSource();
                    noise.buffer = buffer;
                    const gain = audioCtx.createGain();
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    noise.connect(gain); gain.connect(audioCtx.destination);
                    noise.start();
                } catch(e){}
            },
            warp: () => {
                if(PERF_MODE) return;
                playTone(100, 'sawtooth', 0.5, 0.1);
            }

        // --- MATRIX RAIN SYSTEM ---
        function initDigitalRain() {
            if(PERF_MODE) return;
            digitalRain = [];
            // Columns of code
            const columns = Math.floor(width / 20);
            for(let i=0; i<columns; i++) {
                digitalRain.push({
                    x: i * 20,
                    y: Math.random() * height,
                    speed: Math.random() * 5 + 2,
                    chars: [], // Trail of chars
                    lastUpdate: 0
                });
            }
        }

        function updateDigitalRain() {
            if(PERF_MODE) return;
            const biome = BIOMES[currentBiome];
            
            for(let d of digitalRain) {
                d.y += d.speed;
                if(d.y > height) {
                    d.y = -20;
                    d.speed = Math.random() * 5 + 2;
                }
                
                // Random character flickering
                if(Math.random() < 0.05) {
                    d.char = Math.random() < 0.5 ? '0' : '1';
                    if(biome.char !== '0' && biome.char !== '1') d.char = biome.char;
                }
            }
        }

        function drawDigitalRain() {
            const biome = BIOMES[currentBiome];
            
            if(PERF_MODE) {
                ctx.fillStyle = biome.bgBot;
                ctx.fillRect(0,0,width,height);
                return;
            }

            // Dark tech gradient
            let grad=ctx.createLinearGradient(0,0,0,height); 
            grad.addColorStop(0, biome.bgTop); grad.addColorStop(1, biome.bgBot); 
            ctx.fillStyle=grad; ctx.fillRect(0,0,width,height);

            // Draw grid lines
            ctx.strokeStyle = biome.grid;
            ctx.lineWidth = 1;
            ctx.globalAlpha = 0.1;
            
            // Moving Grid Floor effect
            let gridOffset = (frames * 2) % 50;
            ctx.beginPath();
            // Perspective lines
            for(let i=0; i<width; i+=80) { ctx.moveTo(i, 0); ctx.lineTo(i, height); }
            // Horizontal lines
            for(let i=0; i<height; i+=50) { ctx.moveTo(0, i + gridOffset); ctx.lineTo(width, i + gridOffset); }
            ctx.stroke();

            // Draw Rain
            ctx.font = "14px monospace";
            for(let d of digitalRain) {
                ctx.globalAlpha = 0.3;
                ctx.fillStyle = biome.grid;
                let char = d.char || (Math.random() < 0.5 ? '0' : '1');
                ctx.fillText(char, d.x, d.y);
                
                // Head of the stream is brighter
                ctx.globalAlpha = 0.8;
                ctx.fillStyle = "#fff";
                ctx.fillText(char, d.x, d.y + 15);
            }
            ctx.globalAlpha=1;
        }

        // --- PLAYER (DATA DRONE) ---
        const player = {
            x: 60, y: 200, size: 30, velocity: 0, rotation: 0,
            shieldCount: 0, 
            
            update: function() {
                this.velocity += GRAVITY; 
                this.y += this.velocity;
                
                if(frames % 3 === 0 && gameState === 'PLAY') {
                    trail.push({x: this.x, y: this.y, alpha: 1.0});
                    if(trail.length > 10) trail.shift();
                }
                // Subtle hover rotation
                this.rotation = Math.min(Math.max(this.velocity * 3, -25), 25);
            },
            draw: function() {
                const biome = BIOMES[currentBiome];
                const mainColor = player.shieldCount > 0 ? "#00ff41" : "#00ffff"; // Green if shielded, Cyan normal

                // Digital Trail
                for(let i=0; i<trail.length; i++) {
                    let t = trail[i];
                    let size = (this.size/2) * (i/trail.length);
                    ctx.fillStyle = mainColor;
                    ctx.globalAlpha = i/trail.length * 0.5;
                    ctx.fillRect(t.x + (this.size/2) - size/2, t.y + (this.size/2) - size/2, size, size);
                }
                ctx.globalAlpha = 1;

                ctx.save(); 
                ctx.translate(this.x+this.size/2, this.y+this.size/2); 
                ctx.rotate(this.rotation*Math.PI/180);

                if(!PERF_MODE) { ctx.shadowBlur=20; ctx.shadowColor=mainColor; }
                
                // THE DRONE BODY
                ctx.strokeStyle = mainColor;
                ctx.lineWidth = 2;
                ctx.strokeRect(-this.size/2, -this.size/2, this.size, this.size);
                
                // Inner core
                ctx.fillStyle = "#fff";
                ctx.fillRect(-5, -5, 10, 10);
                
                // Scanning line
                let scanY = (frames % 20) - 10;
                ctx.fillStyle = mainColor;
                ctx.fillRect(-this.size/2, scanY, this.size, 2);

                // SHIELD OVERLAY (Hexagon)
                if(this.shieldCount > 0) {
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        ctx.lineTo(35 * Math.cos(i * Math.PI / 3), 35 * Math.sin(i * Math.PI / 3));
                    }
                    ctx.closePath();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = `rgba(0, 255, 65, ${Math.abs(Math.sin(frames*0.1)) + 0.5})`;
                    ctx.stroke();
                }
                
                ctx.restore(); ctx.shadowBlur=0;
            }
        };

        const obstacles = {
            list: [],
            update: function() {
                let effectiveScore = score - difficultyOffset;
                let speedLimit = infiniteMode ? 8 : 10; 
                currentSpeed = Math.min(speedLimit, BASE_SPEED + (effectiveScore * 0.06));
                
                let dynamicGap = Math.max(130, BASE_GAP - (score * 1.0)); // Slightly wider gap for tech theme
                
                if(frames % Math.floor(55 * (7 / currentSpeed)) === 0) {
                    pipeSpawnCount++;
                    let minH = 60; 
                    let maxH = height - dynamicGap - minH;
                    let prevTop = (this.list.length > 0) ? this.list[this.list.length-1].top : (height - dynamicGap) / 2;
                    let direction = Math.random() < 0.5 ? 1 : -1;
                    if (prevTop < minH + 50) direction = 1; else if (prevTop > maxH - 50) direction = -1;
                    let step = Math.floor(Math.random() * (180 - 60 + 1)) + 60;
                    let topH = prevTop + (step * direction);
                    if(topH < minH) topH = minH + 20; if(topH > maxH) topH = maxH - 20;
                    
                    let anomalyChance = Math.min(0.6, 0.2 + (score * 0.012));
                    let isAnomaly = Math.random() < anomalyChance;
                    let baseAnomalySpeed = score > 30 ? 2.2 : 1.5;
                    let anomalySpeed = isAnomaly ? (baseAnomalySpeed * (Math.random()<0.5?1:-1)) : 0;
                    let centerY = topH + (dynamicGap / 2);

                    let spawnType = null;
                    // "FIREWALL PATCH" -> Shield
                    if (!infiniteMode && level1ShieldCount < 2 && Math.random() < 0.1 && player.shieldCount === 0) spawnType = 'SHIELD';
                    else if (infiniteMode && pipeSpawnCount % 25 === 0 && player.shieldCount < 3) spawnType = 'SHIELD';
                    
                    // "LAG SWITCH" -> Clock
                    if (!infiniteMode && score >= 30 && level1ClockCount < 2 && Math.random() < 0.15 && !timeStopActive) spawnType = 'CLOCK';
                    else if (infiniteMode && pipeSpawnCount % 30 === 0 && !timeStopActive) spawnType = 'CLOCK';
                    
                    // "ENCRYPTED DATA" -> Mystery
                    if (!spawnType && !timeStopActive && Math.random() < 0.15) items.push({ x: width + 100, y: Math.random() * (height - 200) + 100, type: 'MYSTERY', taken: false });
                    if (spawnType) items.push({ x: width + 20, y: topH + (dynamicGap / 2), type: spawnType, taken: false });
                    
                    this.list.push({
                        x: width, w: 60, // Wider "Server racks"
                        top: topH, bottom: height-dynamicGap-topH, 
                        originalTop: topH, passed: false, 
                        isAnomaly: isAnomaly, anomalySpeed: anomalySpeed, centerY: centerY,
                        breathSpeed: 0.03 + Math.random() * 0.05,
                        breathPhase: Math.random() * Math.PI * 2,
                        breathAmp: 30 + Math.random() * 40,
                        isTrap: !isAnomaly && Math.random() < 0.3,
                        hasBeenHit: false, gapSize: dynamicGap, moveRange: 80 
                    });
                }

                for(let p of this.list) {
                    p.x -= currentSpeed;
                    
                    if (!timeStopActive) {
                        if (orangeModeActive && p.anomalySpeed === 0) p.anomalySpeed = (Math.random() < 0.5 ? 1 : -1) * 2.5;
                        if (!orangeModeActive && !p.isAnomaly && p.anomalySpeed !== 0) p.anomalySpeed = 0;

                        if (p.isAnomaly || orangeModeActive) {
                             p.top += p.anomalySpeed; p.bottom -= p.anomalySpeed; 
                             let upperLimit = p.originalTop - p.moveRange;
                             let lowerLimit = p.originalTop + p.moveRange;
                             if(p.top < 40 || p.top > height - p.gapSize - 40 || p.top < upperLimit || p.top > lowerLimit) p.anomalySpeed *= -1;
                        } else {
                            let wave = Math.sin(frames * p.breathSpeed + p.breathPhase);
                            let currentGap = p.gapSize + (wave * p.breathAmp * 0.5); 
                            if (p.isTrap) {
                                let distToPlayer = p.x - player.x;
                                if (distToPlayer < 300 && distToPlayer > -50) currentGap -= (300 - distToPlayer) * 0.35; 
                            }
                            if (currentGap < 90) currentGap = 90; 
                            p.top = p.centerY - (currentGap / 2);
                            p.bottom = height - (p.centerY + (currentGap / 2));
                        }
                    }

                    // COLLISION
                    if (!p.hasBeenHit) {
                        let hitRadius = (player.size / 2) - 4; 
                        let playerCx = player.x + (player.size / 2);
                        let playerCy = player.y + (player.size / 2);
                        const checkHit = (rectX, rectY, rectW, rectH) => {
                            let closestX = Math.max(rectX, Math.min(playerCx, rectX + rectW));
                            let closestY = Math.max(rectY, Math.min(playerCy, rectY + rectH));
                            let distanceX = playerCx - closestX;
                            let distanceY = playerCy - closestY;
                            return (distanceX * distanceX + distanceY * distanceY) < (hitRadius * hitRadius);
                        };

                        if (checkHit(p.x, 0, p.w, p.top) || checkHit(p.x, height - p.bottom, p.w, p.bottom)) {
                            if (player.shieldCount > 0) {
                                player.shieldCount--; 
                                p.hasBeenHit = true; 
                                SFX.shieldBreak(); 
                                triggerShake();
                                if(!PERF_MODE) {
                                    floatTexts.push({text: "SHIELD LOST", x: player.x, y: player.y-40, life: 1.5, vy: -1, color: 'orange'});
                                    for(let i=0; i<10; i++) particles.push({type: 'explode', x: player.x, y: player.y, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 0.8, color: '#fff', size: 4});
                                }
                            } else {
                                die();
                            }
                        }
                    }

                    if(p.x + p.w < player.x && !p.passed) {
                        score++; p.passed = true; SFX.score(); triggerShake();
                        if (infiniteMode) scoreCounter.innerText = score; else updateProgress();
                        switchBiome();
                        if(!PERF_MODE && p.isAnomaly) floatTexts.push({text: "GLITCH BYPASS", x: player.x, y: player.y-40, life: 1.2, vy: -3, color: '#0ff'});
                        if(!infiniteMode && score >= TARGET_SCORE) winGame();
                    }
                }
                if(this.list.length > 0 && this.list[0].x < -100) this.list.shift();
            },
            
            draw: function() {
                for(let p of this.list) {
                    // SERVER RACK AESTHETIC
                    let borderColor = "#444";
                    let innerColor = "#111";
                    
                    if (p.isAnomaly) borderColor = "#00ff41"; 
                    if (p.isTrap) borderColor = "red"; 
                    if (p.hasBeenHit) borderColor = "#333";
                    if (orangeModeActive && !p.hasBeenHit) borderColor = "red";

                    ctx.fillStyle = innerColor;
                    ctx.fillRect(p.x, 0, p.w, p.top); 
                    ctx.fillRect(p.x, height - p.bottom, p.w, p.bottom);
                    
                    ctx.lineWidth = 2; 
                    ctx.strokeStyle = borderColor;
                    ctx.strokeRect(p.x, -2, p.w, p.top+2); 
                    ctx.strokeRect(p.x, height-p.bottom, p.w, p.bottom+2);

                    // Server Lights (Blinking)
                    if(!PERF_MODE) {
                        ctx.fillStyle = borderColor;
                        for(let y=10; y<p.top-10; y+=20) {
                            if(Math.random() > 0.5) ctx.fillRect(p.x + 5, y, p.w - 10, 2);
                            if(Math.random() > 0.8) ctx.fillRect(p.x + p.w - 10, y, 5, 5); // Blinking LED
                        }
                        for(let y=height-p.bottom+10; y<height; y+=20) {
                             if(Math.random() > 0.5) ctx.fillRect(p.x + 5, y, p.w - 10, 2);
                        }
                    }
                }
            }
        };

        window.resetLevel = function() {
            deathModal.style.display = 'none';
            bgFail.style.opacity = '0';
            bgWin.style.opacity = '0';
            setTimeout(() => { bgFail.style.display = 'none'; bgWin.style.display = 'none'; }, 500);

            gameState = 'START';
            
            if(isCheatActive) {
                score = 10;
                difficultyOffset = 10; 
            } else {
                score = 0;
                difficultyOffset = 0; 
            }
            
            frames = 0;
            pipeSpawnCount = 0; 
            currentBiome = 0; 
            currentSpeed = BASE_SPEED;
            timeStopActive = false;
            orangeModeActive = false;
            canvas.classList.remove('time-frozen');
            level1ShieldCount = 0;
            level1ClockCount = 0;
            
            if (isUnlocked) {
                infiniteMode = true;
                progressContainer.style.display = 'none';
                scoreCounter.style.display = 'block'; 
                scoreCounter.innerText = score;
            } else {
                infiniteMode = false;
                progressContainer.style.display = 'flex';
                scoreCounter.style.display = 'none';
                updateProgress();
            }

            wrapper.style.borderColor = "#333";
            player.y = height/2; player.velocity = 0; player.rotation = 0;
            player.shieldCount = 0; 
            
            obstacles.list = []; trail = []; shockwaves = []; floatTexts = []; items = [];
            initDigitalRain(); initParticles();
            document.getElementById('main-menu').style.display = 'block';
            drawDigitalRain(); player.draw();
            MUSIC.stop();
        };

        function startGame() {
            if(gameState === 'PLAY') return;
            try {
                 if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
            } catch(e){}
            
            gameStartTime = Date.now();
            if(infiniteMode) scoreCounter.style.display = 'block';
            gameState = 'PLAY';
            MUSIC.play();
            document.getElementById('main-menu').style.display = 'none';
            player.velocity = -JUMP;
        }

        function updatePhysics() {
            if (!timeStopActive) {
                bgOffset -= currentSpeed * 0.5; if(bgOffset < -100) bgOffset = 0;
                globalHue = (globalHue + 1) % 360;
                updateDigitalRain(); 
            }

            if(gameState !== 'PLAY' && gameState !== 'DIE_ANIM') return;
            
            if (timeStopActive) {
                timeStopTimer--;
                if (timeStopTimer <= 0) {
                    timeStopActive = false;
                    canvas.classList.remove('time-frozen'); 
                    SFX.shieldUp();
                }
            }
            
            if(orangeModeActive) {
                orangeModeTimer--;
                if(orangeModeTimer <= 0) {
                    orangeModeActive = false;
                }
            }

            frames++;

            if (!timeStopActive) {
                particles = particles.filter(p => { if(p.type==='dust') { p.x -= p.speed; if(p.x<0) p.x=width; return true; } p.x += p.vx; p.y += p.vy; p.life -= 0.03; return p.life > 0; });
            }
            
            shockwaves = shockwaves.filter(s => { s.r+=10; s.alpha-=0.05; return s.alpha>0; });
            floatTexts = floatTexts.filter(f => { f.y+=f.vy; f.life-=0.02; return f.life>0; });
            trail = trail.filter(t => { t.alpha -= 0.08; return t.alpha > 0; });

            items = items.filter(item => {
                item.x -= currentSpeed;
                let dx = item.x - player.x;
                let dy = item.y - player.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 40 && !item.taken) {
                   item.taken = true;
                   if (item.type === 'MYSTERY') {
                       if (Math.random() > 0.4) {
                           let prize = Math.random();
                           if (prize > 0.5) {
                               score += 5; SFX.score();
                               floatTexts.push({text: "DATA BURST +5", x: player.x, y: player.y-40, life: 1.5, vy: -2, color: '#00ff41'});
                           } else {
                               player.shieldCount++; SFX.shieldUp();
                               floatTexts.push({text: "PROXY SHIELD", x: player.x, y: player.y-40, life: 1.5, vy: -2, color: '#00ff41'});
                           }
                       } else {
                           if (Math.random() > 0.5) {
                               score = Math.max(0, score - 5);
                               floatTexts.push({text: "CORRUPTION -5", x: player.x, y: player.y-40, life: 1.5, vy: -2, color: 'red'});
                           } else {
                               triggerOrangeMode();
                           }
                       }
                   }
                   else if (item.type === 'SHIELD') {
                       player.shieldCount++; SFX.shieldUp();
                       if(!PERF_MODE) floatTexts.push({text: "SHIELD UP", x: player.x, y: player.y-40, life: 1.0, vy: -2, color: '#00ff41'});
                   } else if (item.type === 'CLOCK') {
                       timeStopActive = true;
                       timeStopTimer = 60 * 5; 
                       canvas.classList.add('time-frozen'); 
                       SFX.timeStop();
                       if(!PERF_MODE) floatTexts.push({text: "LAG SWITCH", x: player.x, y: player.y-40, life: 1.5, vy: -2, color: '#00ffff'});
                   }
                }
                return item.x > -50 && !item.taken;
            });

            if(gameState === 'PLAY') {
                obstacles.update();
                player.update();
                if(player.y > height || player.y < -50) die();
            }
        }

        function loop(timestamp) {
            try {
                if (!lastTime) lastTime = timestamp;
                let deltaTime = timestamp - lastTime; lastTime = timestamp;
                if (deltaTime > 1000) deltaTime = 1000;
                accumulator += deltaTime;
                while (accumulator >= TIME_STEP) { updatePhysics(); accumulator -= TIME_STEP; }

                drawDigitalRain();
                
                ctx.lineWidth = 4; for(let s of shockwaves) { ctx.strokeStyle = `rgba(255, 255, 255, ${s.alpha})`; ctx.beginPath(); ctx.arc(s.x+15, s.y+15, s.r, 0, Math.PI*2); ctx.stroke(); }
                
                // MINI-POPUP RENDERING
                for(let f of floatTexts) { 
                    ctx.save(); 
                    ctx.font = "900 16px 'Share Tech Mono'";
                    let txtW = ctx.measureText(f.text).width + 20;
                    ctx.fillStyle = f.bg || "rgba(0,0,0,0.8)";
                    ctx.fillRect(f.x - txtW/2, f.y - 25, txtW, 35);
                    ctx.fillStyle = f.color || "#fff"; 
                    ctx.textAlign = "center";
                    ctx.fillText(f.text, f.x, f.y); 
                    ctx.restore(); 
                }
                
                for(let item of items) {
                    ctx.save();
                    ctx.shadowBlur = 15; 
                    if (item.type === 'SHIELD') {
                        ctx.shadowColor = '#00ff41';
                        ctx.fillStyle = "#00ff41"; 
                        ctx.beginPath(); ctx.arc(item.x, item.y, 15, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = "#000"; ctx.fillText("P", item.x-4, item.y+5);
                    } else if (item.type === 'CLOCK') {
                        ctx.shadowColor = '#00ffff'; 
                        ctx.fillStyle = "#00ffff";
                        ctx.beginPath(); ctx.arc(item.x, item.y, 15, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = "#000"; ctx.fillText("L", item.x-4, item.y+5); 
                    } else if (item.type === 'MYSTERY') {
                        ctx.shadowColor = '#ff00ff';
                        ctx.fillStyle = "#ff00ff";
                        ctx.fillRect(item.x-12, item.y-12, 24, 24);
                        ctx.fillStyle = "#fff"; ctx.font="bold 20px monospace"; ctx.textAlign="center"; ctx.fillText("?", item.x, item.y+7);
                    }
                    ctx.restore();
                }

                obstacles.draw();
                if(gameState === 'PLAY' || gameState === 'DIE_ANIM' || gameState === 'WIN_PAUSE') player.draw();

                for(let p of particles) { if(p.type === 'explode') { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fillRect(p.x, p.y, p.size, p.size); } } ctx.globalAlpha = 1;

                requestAnimationFrame(loop);
            } catch(e) { logError(e.toString()); }
        }

        function initParticles() {
            if(PERF_MODE) return;
            particles = []; 
        }

        function handleInput(e) {
            if(e.type === 'keydown' && e.code === 'Space') e.preventDefault();
            if(e.target.id === 'perf-btn') return;
            if(e.target.id === 'cheat-btn') return;
            if(e.target.closest('#leaderboard')) return;
            if(e.target.closest('.win-input-field')) return; 

            if(gameState === 'WIN_PAUSE') return;
            if(gameState === 'START') startGame();
            else if(gameState === 'PLAY') {
                player.velocity = -JUMP; SFX.jump();
                if(!PERF_MODE) {
                    for(let i=0; i<3; i++) particles.push({type: 'explode', x: player.x, y: player.y+player.size, vx: (Math.random()-0.5)*5, vy: Math.random()*5, life: 0.5, color: '#00ff41', size: 2});
                }
            }
        }

        window.addEventListener('keydown', (e) => { if(e.code === 'Space' || e.code === 'ArrowUp') handleInput(e); });
        window.addEventListener('mousedown', handleInput);
        window.addEventListener('touchstart', handleInput, {passive: false});

        // --------------------------------------------------------
        // FIREBASE & LEADERBOARD LOGIC
        // --------------------------------------------------------

        const firebaseConfig = {
            apiKey: "AIzaSyCTnLXpYRMw8pxaBS1cIqeeGqtD7A1Mtow",
            authDomain: "powa-2f1bc.firebaseapp.com",
            projectId: "powa-2f1bc",
            storageBucket: "powa-2f1bc.firebasestorage.app",
            messagingSenderId: "522344119710",
            appId: "1:522344119710:web:3bd572ef6580abd4c76a8f"
        };

        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentLeaderboardListener = null;

        window.switchTab = function(mode) {
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            if(mode === 'daily') buttons[0].classList.add('active');
            else buttons[1].classList.add('active');
            fetchLeaderboard(mode);
        };

        function fetchLeaderboard(mode) {
            const listDiv = document.getElementById('leaderboard-list');
            listDiv.innerHTML = "<div style='text-align:center; color:var(--neon-green); padding-top:20px;' class='blink'>FETCHING DATA...</div>";

            if(currentLeaderboardListener) currentLeaderboardListener(); 

            let collectionName;
            if (mode === 'daily') {
                collectionName = `leaderboard_${KEY_ID}`;
            } else {
                collectionName = `leaderboard_${getWeekId()}`;
            }

            currentLeaderboardListener = db.collection(collectionName)
                .orderBy("score", "desc")
                .limit(10)
                .onSnapshot((querySnapshot) => {
                    let html = ""; let rank = 1;
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        const safeName = data.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        
                        let rankColor="#555"; let bgStyle="transparent";
                        if(rank===1) rankColor="#00ff41"; 
                        else if(rank===2) rankColor="#00ffff"; 
                        else if(rank===3) rankColor="#ff00ff"; 

                        html += `<div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #222; padding: 5px 4px; margin-bottom: 2px;">
                            <span style="color:${rankColor}; font-family:'Share Tech Mono'; font-size:0.9rem;">
                                <span style="display:inline-block; width:25px; text-align:right; margin-right:10px;">[${rank}]</span>${safeName}
                            </span>
                            <span style="color:${rankColor}; font-family:'Share Tech Mono'; font-size:1rem;">${data.score}</span>
                        </div>`;
                        rank++;
                    });
                    if(html==="") html="<div style='text-align:center; color:#444; margin-top:30px; font-family:monospace;'>[ NULL POINTER ]</div>";
                    listDiv.innerHTML = html;
                });
        }

        function submitToCollection(collectionName, name, score) {
            return db.collection(collectionName).where("name", "==", name).get()
            .then((snapshot) => {
                if(!snapshot.empty) {
                    let docId = snapshot.docs[0].id;
                    let oldScore = snapshot.docs[0].data().score;
                    if(score > oldScore) return db.collection(collectionName).doc(docId).update({score: score, date: new Date()});
                    else return Promise.resolve();
                } else {
                    return db.collection(collectionName).add({name: name, score: score, date: new Date()});
                }
            });
        }

        window.submitScore = function(isAuto = false) {
            let storedName = localStorage.getItem('powa-username');
            let rawName = storedName || "";
            const nameInput = document.getElementById('username-input'); 
            const submitBtn = document.getElementById('submit-score-btn');

            if (!isAuto && nameInput) rawName = nameInput.value;
            const name = rawName.toUpperCase().trim().substring(0, 15) || "GUEST_USER";
            localStorage.setItem('powa-username', name);

            if(score===0 && !isAuto) { alert("NO DATA TO UPLOAD"); return; }
            
            let scoreToSend = parseInt(score, 10);
            
            if(submitBtn) {
                submitBtn.innerText = isAuto ? "UPLOADING..." : "VERIFYING...";
                submitBtn.disabled = true; 
                if(nameInput) nameInput.disabled = true;
            }

            const dailyCollection = `leaderboard_${KEY_ID}`;
            const weeklyCollection = `leaderboard_${getWeekId()}`;
            
            Promise.all([
                submitToCollection(weeklyCollection, name, scoreToSend),   
                submitToCollection(dailyCollection, name, scoreToSend)
            ]).then(() => {
                if(submitBtn) {
                    submitBtn.innerText = "UPLOAD COMPLETE";
                    submitBtn.style.background = "#002200";
                    submitBtn.style.color = "#005500";
                }
            }).catch((err) => {
                console.error(err);
                if(submitBtn) {
                    submitBtn.innerText = "UPLOAD FAILED";
                    submitBtn.disabled = false;
                }
            });
        };

        checkGlobalCheatStatus();
        initDigitalRain(); initParticles(); resetLevel(); requestAnimationFrame(loop);
        switchTab('daily');

        if (KEY_WARNING_MODE === "ON") {
            const warnBox = document.getElementById('key-warning');
            if(warnBox) warnBox.style.display = 'block';
        }
    </script>
